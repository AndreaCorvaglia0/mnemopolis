name: Build courses

# Validates every course, builds the ones that are complete, and publishes them with GitHub Pages
# (turn Pages on in Settings → Pages → Source: GitHub Actions; without it the games are still
# available as the "games" artifact of each run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every course
        run: |
          status=0
          for d in courses/*/; do
            [ -f "$d/course.json" ] || { echo "skipping $d (no course.json yet)"; continue; }
            node skills/knowledge-base/scripts/validate.mjs "$d" || status=1
          done
          exit $status
      - run: npm run setup
      - name: Engine tests (rooms, homes, course format)
        run: npm test
      - name: Build every complete course
        run: |
          mkdir -p site/_site/media
          for d in courses/*/; do
            slug=$(basename "$d")
            [ -f "$d/course.json" ] || continue
            if COURSE="$slug" npm run build; then
              mkdir -p "site/$slug" && cp engine/dist/index.html "site/$slug/index.html"
              # two pictures of the game for the front page (town at night, one lab); never fails the build
              node engine/scripts/cataloguemedia.mjs "site/$slug/index.html" site/_site/media "$slug" || echo "::warning::no front-page pictures for $slug"
            else
              echo "::warning::course $slug is not complete yet (see the log): not published"
            fi
          done
      - name: Prebuilt player, the /play/ page, and games packed without a build
        # pack.mjs needs no packages and no bundler: the demo at /pocket-demo/ is made that way, and the
        # packed games are compared with their bundled builds (places, questions, every station)
        run: |
          npm --prefix engine run build:player
          npm --prefix engine run build:play
          mkdir -p site/play && cp engine/dist/play/index.html site/play/ && cp engine/dist/player.html site/play/
          ls -l site/play
          cp site/chroma/index.html /tmp/chroma-bundled.html && cp site/pocket-demo/index.html /tmp/pocket-demo-bundled.html
          node scripts/pack.mjs courses/chroma /tmp/chroma-packed.html
          node scripts/pack.mjs courses/pocket-demo site/pocket-demo/index.html
          node engine/scripts/packcheck.mjs /tmp/chroma-bundled.html /tmp/chroma-packed.html courses/chroma
          node engine/scripts/packcheck.mjs /tmp/pocket-demo-bundled.html site/pocket-demo/index.html courses/pocket-demo
          node engine/scripts/playcheck.mjs courses/pocket-demo
      - name: Front page (English and Italian), from the courses and their pictures
        run: |
          node scripts/build-site.mjs --out site --featured chroma
          ls -l site site/it site/_site site/_site/media
      - uses: actions/upload-artifact@v4
        with:
          name: games
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # Pages may be off
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
