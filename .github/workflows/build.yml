name: Build courses

# Validates every course, builds the ones that are complete, and publishes them with GitHub Pages
# (turn Pages on in Settings → Pages → Source: GitHub Actions; without it the games are still
# available as the "games" artifact of each run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every course
        run: |
          status=0
          for d in courses/*/; do
            [ -f "$d/course.json" ] || { echo "skipping $d (no course.json yet)"; continue; }
            node skills/knowledge-base/scripts/validate.mjs "$d" || status=1
          done
          exit $status
      - run: npm run setup
      - name: Engine tests (rooms, homes, course format)
        run: npm test
      - name: Build every complete course
        run: |
          mkdir -p site
          echo '<!doctype html><meta charset="utf-8"><title>Mnemopolis</title><body style="font:18px system-ui;max-width:640px;margin:60px auto;padding:0 20px"><h1>Mnemopolis</h1><ul>' > site/index.html
          for d in courses/*/; do
            slug=$(basename "$d")
            [ -f "$d/course.json" ] || continue
            if COURSE="$slug" npm run build; then
              mkdir -p "site/$slug" && cp engine/dist/index.html "site/$slug/index.html"
              title=$(node -p "require('./courses/$slug/course.json').title")
              echo "<li><a href=\"$slug/\">$title</a></li>" >> site/index.html
            else
              echo "::warning::course $slug is not complete yet (see the log): not published"
            fi
          done
          echo '</ul>' >> site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: games
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # Pages may be off
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
