<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mnemopolis: make a game from a course</title>
  <style>
    :root { --bg:#0d1016; --panel:#131821; --card:#192030; --line:#263041; --text:#e8eaf0; --muted:#b0b8c9; --acc:#4fd1c5; --ink:#04201d; --gold:#ffcf5a; --bad:#ff7a6b; --ok:#7ddc8a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 14px; }
    ol.how { margin: 0 0 18px; padding-left: 24px; } ol.how li { margin: 6px 0; }
    .note { color: var(--muted); font-size: 16px; margin: 6px 0; }
    .drop { margin: 22px 0 12px; padding: 26px 20px; border: 2px dashed #3a4659; border-radius: 16px; background: var(--panel); text-align: center; transition: border-color .15s, background .15s; }
    .drop.over { border-color: var(--acc); background: #13242a; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
    button, .btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #34405a; background: var(--card); color: var(--text); font: 600 16px system-ui, sans-serif; cursor: pointer; display: inline-flex; align-items: center; }
    button:hover, .btn:hover { border-color: var(--acc); }
    button.primary { background: var(--acc); color: var(--ink); border-color: var(--acc); }
    button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    details { margin: 10px 0; } summary { cursor: pointer; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
    textarea { width: 100%; min-height: 160px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 14px ui-monospace, Menlo, Consolas, monospace; }
    .files { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .files li { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 15px; color: var(--muted); }
    .out { margin-top: 18px; }
    .msg { padding: 12px 16px; border-radius: 12px; margin: 10px 0; }
    .msg.bad { background: #2a1714; border: 1px solid #6b2f27; }
    .msg.ok { background: #13242a; border: 1px solid #2c5f5a; }
    .msg ul { margin: 8px 0 0; padding-left: 20px; } .msg li { margin: 4px 0; }
    .warn { color: var(--muted); font-size: 15px; }
    .game { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column; }
    .game[hidden] { display: none; }
    .game .bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .game .bar span { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .game iframe { flex: 1; border: 0; width: 100%; }
  </style>
</head>
<body>
  <main>
    <h1 data-t="title"></h1>
    <ol class="how"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li></ol>
    <p class="note" data-t="private"></p>
    <p class="note" data-t="code"></p>
    <div class="drop" id="drop">
      <div data-t="drop"></div>
      <div class="row">
        <label class="btn" for="pick" data-t="pickFiles"></label><input id="pick" type="file" multiple accept=".json,.js,.md" />
        <label class="btn" for="pickDir" data-t="pickFolder"></label><input id="pickDir" type="file" webkitdirectory multiple />
      </div>
    </div>
    <details><summary data-t="paste"></summary><textarea id="pasted" spellcheck="false" aria-label="course.json"></textarea><div class="row"><button type="button" id="usePaste" data-t="check"></button></div></details>
    <ul class="files" id="files" aria-live="polite"></ul>
    <div class="out" id="out" aria-live="polite"></div>
  </main>
  <div class="game" id="game" hidden><div class="bar"><span id="gameTitle"></span><button type="button" id="dl2" data-t="download"></button><button type="button" id="close" data-t="close"></button></div><iframe id="frame" title="game" allow="autoplay; fullscreen"></iframe></div>
  <script type="module" src="./play.js"></script>
</body>
</html>
